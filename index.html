<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanthe Interface</title>
    <style>
        :root {
            --bg-color: #0d0d0d;
            --chat-bg: #1a1a1a;
            --accent-red: #cc0000;
            --text-main: #e0e0e0;
            --text-muted: #888888;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
        }

        #app-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            border-left: 1px solid #333;
            border-right: 1px solid #333;
        }

        #header {
            padding: 20px;
            text-align: center;
            border-bottom: 1px solid #333;
            font-weight: bold;
            color: var(--accent-red);
            letter-spacing: 2px;
        }

        #chat-box {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            max-width: 80%;
            padding: 12px 16px;
            border-radius: 4px;
            line-height: 1.4;
            word-wrap: break-word;
        }

        .user-msg {
            align-self: flex-end;
            background-color: #262626;
            color: #fff;
            border-right: 3px solid #555;
        }

        .xanthe-msg {
            align-self: flex-start;
            background-color: #111;
            color: var(--text-main);
            border-left: 3px solid var(--accent-red);
        }

        .selfie-img {
            max-width: 100%;
            border-radius: 4px;
            margin-top: 10px;
            border: 1px solid var(--accent-red);
        }

        #input-container {
            display: flex;
            padding: 15px;
            background-color: var(--bg-color);
            border-top: 1px solid #333;
        }

        #user-input {
            flex-grow: 1;
            background-color: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            padding: 12px;
            font-family: inherit;
            outline: none;
        }

        #user-input:focus {
            border-color: var(--accent-red);
        }

        #send-btn {
            background-color: var(--accent-red);
            color: #fff;
            border: none;
            padding: 0 20px;
            margin-left: 10px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            transition: background 0.2s;
        }

        #send-btn:hover {
            background-color: #ff0000;
        }
    </style>
</head>
<body>

    <div id="app-container">
        <div id="header">XANTHE // TERMINAL</div>
        <div id="chat-box"></div>
        
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Type something..." autocomplete="off">
            <button id="send-btn">SEND</button>
        </div>
    </div>

    <script>
        // --- IMPORTANT: Update this URL when you run ngrok/localtunnel ---
        // GitHub Pages uses HTTPS, so you CANNOT use http://localhost:3000 here.
        // You must use an HTTPS tunnel URL that points to your local server.
        // --- IMPORTANT: Update this URL when you run ngrok/localtunnel ---
const BACKEND_URL = "https://clear-lights-search.loca.lt/api/chat"; 

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');

        let chatHistory = [];

        function addMessage(role, text, imageUrl = null) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(role === 'user' ? 'user-msg' : 'xanthe-msg');
            msgDiv.innerText = text;

            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                img.classList.add('selfie-img');
                img.alt = "Xanthe Selfie";
                msgDiv.appendChild(img);
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            userInput.value = '';
            
            // Temporary typing indicator
            const typingDiv = document.createElement('div');
            typingDiv.classList.add('message', 'xanthe-msg');
            typingDiv.id = 'typing-indicator';
            typingDiv.innerText = "...";
            chatBox.appendChild(typingDiv);
            chatBox.scrollTop = chatBox.scrollHeight;

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: chatHistory })
                });

                if (!response.ok) throw new Error("Server response was not ok.");

                const data = await response.json();
                
                // Remove typing indicator
                document.getElementById('typing-indicator').remove();

                // If your backend eventually generates an image, it should return the image URL
                // For now, if triggerSelfie is true, we can pass a placeholder or null
                const imageUrl = data.triggerSelfie ? data.imageUrl : null; 

                addMessage('xanthe', data.reply, imageUrl);

                chatHistory.push({ role: 'user', content: text });
                chatHistory.push({ role: 'assistant', content: data.reply });

            } catch (error) {
                console.error("Error:", error);
                document.getElementById('typing-indicator').remove();
                addMessage('xanthe', "[Connection to Xanthe lost.]");
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
