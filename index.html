<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanthe // Terminal</title>
    <style>
        :root { --accent: #ff0055; --bg: #0a0a0a; --text: #e0e0e0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; display: flex; flex-direction: column; height: 100vh; margin: 0; }
        #chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
        .msg { max-width: 80%; padding: 12px; border-radius: 8px; line-height: 1.4; }
        .user { align-self: flex-end; background: #222; border-right: 3px solid var(--accent); }
        .xanthe { align-self: flex-start; background: #1a1a1a; border-left: 3px solid var(--accent); }
        .selfie { width: 100%; max-width: 300px; border-radius: 8px; margin-top: 10px; border: 1px solid var(--accent); }
        #input-area { padding: 20px; background: #111; display: flex; gap: 10px; }
        input { flex: 1; background: #000; border: 1px solid #333; color: white; padding: 12px; outline: none; }
        input:focus { border-color: var(--accent); }
        button { background: var(--accent); color: white; border: none; padding: 0 20px; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div id="chat-container"></div>
    <div id="input-area">
        <input type="text" id="user-input" placeholder="Say something dangerous...">
        <button onclick="sendMessage()">SEND</button>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        let history = [];

        async function sendMessage() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if (!text) return;

            appendMessage('user', text);
            input.value = '';

            try {
                // Change this to your Ngrok URL or local IP later
                const response = await fetch('https://sad-shrimps-wear.loca.lt/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: history })
                });

                const data = await response.json();
                appendMessage('xanthe', data.reply, data.triggerSelfie ? 'https://via.placeholder.com/300?text=Generating+Selfie...' : null);
                
                history.push({ role: 'user', content: text });
                history.push({ role: 'assistant', content: data.reply });
            } catch (err) {
                appendMessage('xanthe', "Server's dead, Stacis. Fix it.");
            }
        }

        function appendMessage(role, text, imgUrl = null) {
            const div = document.createElement('div');
            div.className = `msg ${role}`;
            div.innerText = text;
            if (imgUrl) {
                const img = document.createElement('img');
                img.src = imgUrl;
                img.className = 'selfie';
                div.appendChild(img);
            }
            chatContainer.appendChild(div);
            chatContainer.scrollTop = chatContainer.scrollHeight;
        }
    </script>
</body>
</html>
