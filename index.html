<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp - Xanthe</title>
    <style>
        :root {
            --app-bg: #111b21;
            --chat-bg: #0b141a;
            --panel-header: #202c33;
            --msg-in: #202c33;
            --msg-out: #005c4b;
            --text-main: #e9edef;
            --text-muted: #8696a0;
            --input-bg: #2a3942;
        }

        body {
            font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background-color: var(--app-bg);
            margin: 0;
            display: flex;
            justify-content: center;
            height: 100vh;
            color: var(--text-main);
        }

        #app-container {
            width: 100%;
            max-width: 800px;
            display: flex;
            flex-direction: column;
            background-color: var(--chat-bg);
            box-shadow: 0 0 10px rgba(0,0,0,0.5);
            position: relative;
        }

        /* --- HEADER --- */
        #header {
            background-color: var(--panel-header);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 15px;
            z-index: 10;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #1a1a1a, #4a0000); /* Edgy placeholder */
            object-fit: cover;
        }

        .header-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact-name {
            font-size: 16px;
            font-weight: 500;
        }

        .contact-status {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        /* --- CHAT AREA --- */
        #chat-box {
            flex-grow: 1;
            padding: 20px 5%;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
            /* Classic WA dark background pattern */
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-size: contain;
        }

        .message {
            max-width: 65%;
            padding: 6px 7px 8px 9px;
            border-radius: 7.5px;
            font-size: 14.2px;
            line-height: 19px;
            position: relative;
            word-wrap: break-word;
            box-shadow: 0 1px 0.5px rgba(11,20,26,.13);
        }

        .user-msg {
            align-self: flex-end;
            background-color: var(--msg-out);
            border-top-right-radius: 0;
        }

        .xanthe-msg {
            align-self: flex-start;
            background-color: var(--msg-in);
            border-top-left-radius: 0;
        }

        .selfie-img {
            max-width: 100%;
            border-radius: 6px;
            margin-top: 4px;
            display: block;
        }

        .typing-indicator {
            font-style: italic;
            color: var(--text-muted);
            font-size: 13px;
        }

        /* --- INPUT AREA --- */
        #input-container {
            background-color: var(--panel-header);
            padding: 10px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        #user-input {
            flex-grow: 1;
            background-color: var(--input-bg);
            border: none;
            border-radius: 8px;
            color: var(--text-main);
            padding: 9px 12px;
            font-size: 15px;
            font-family: inherit;
            outline: none;
        }

        #user-input::placeholder {
            color: var(--text-muted);
        }

        #send-btn {
            background: transparent;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Simple SVG Send Icon */
        #send-btn svg {
            width: 24px;
            height: 24px;
            fill: var(--text-muted);
            transition: fill 0.2s;
        }

        #send-btn:hover svg {
            fill: var(--text-main);
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 3px; }
    </style>
</head>
<body>

    <div id="app-container">
        <!-- HEADER -->
        <div id="header">
            <div class="avatar"></div>
            <div class="header-info">
                <div class="contact-name">Xanthe</div>
                <div class="contact-status">online</div>
            </div>
        </div>

        <!-- CHAT AREA -->
        <div id="chat-box"></div>
        
        <!-- INPUT AREA -->
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Type a message" autocomplete="off">
            <button id="send-btn">
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        // Your Ngrok Tunnel
        const BACKEND_URL = "https://felica-proteinous-cynically.ngrok-free.dev/api/chat"; 

        const chatBox = document.getElementById('chat-box');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const statusText = document.querySelector('.contact-status');

        let chatHistory = [];

        function addMessage(role, text, imageUrl = null) {
            const msgDiv = document.createElement('div');
            msgDiv.classList.add('message');
            msgDiv.classList.add(role === 'user' ? 'user-msg' : 'xanthe-msg');
            msgDiv.innerText = text;

            if (imageUrl) {
                const img = document.createElement('img');
                img.src = imageUrl;
                img.classList.add('selfie-img');
                img.alt = "Attached Photo";
                msgDiv.appendChild(img);
            }

            chatBox.appendChild(msgDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        async function sendMessage() {
            const text = userInput.value.trim();
            if (!text) return;

            addMessage('user', text);
            userInput.value = '';
            
            statusText.innerText = "typing...";

            try {
                const response = await fetch(BACKEND_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: text, history: chatHistory })
                });

                if (!response.ok) throw new Error("Network error");

                const data = await response.json();
                
                statusText.innerText = "online";
                const imageUrl = data.triggerSelfie ? data.imageUrl : null; 
                addMessage('xanthe', data.reply, imageUrl);

                chatHistory.push({ role: 'user', content: text });
                chatHistory.push({ role: 'assistant', content: data.reply });

            } catch (error) {
                console.error("Error:", error);
                statusText.innerText = "offline";
                addMessage('xanthe', "...");
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });
    </script>
</body>
</html>
