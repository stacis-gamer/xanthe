<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XANTHE // DIRECT</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #030303;
            --text-main: #f0f0f0;
            --text-muted: #555555;
            --accent: #d90429; /* Deep, dangerous crimson */
            --border: #1a1a1a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            height: 100vh;
            display: flex;
            justify-content: center;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* --- Header --- */
        header {
            padding: 40px 30px 20px 30px;
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
        }

        .brand {
            font-weight: 600;
            font-size: 0.85rem;
            letter-spacing: 6px;
            color: var(--text-main);
            text-transform: uppercase;
        }

        .status-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-text {
            font-size: 0.75rem;
            color: var(--text-muted);
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .pulse {
            width: 6px;
            height: 6px;
            background-color: var(--accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--accent);
            animation: breathe 2s infinite ease-in-out;
        }

        @keyframes breathe {
            0%, 100% { opacity: 0.4; box-shadow: 0 0 4px var(--accent); }
            50% { opacity: 1; box-shadow: 0 0 12px var(--accent); }
        }

        /* --- Chat Area --- */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        /* Custom minimal scrollbar */
        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-track { background: var(--bg); }
        .chat-area::-webkit-scrollbar-thumb { background: #222; }
        .chat-area::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

        .message-block {
            display: flex;
            flex-direction: column;
            max-width: 85%;
        }

        .user-msg {
            align-self: flex-end;
            text-align: right;
            color: var(--text-muted);
        }

        .xanthe-msg {
            align-self: flex-start;
            color: var(--text-main);
            border-left: 2px solid var(--accent);
            padding-left: 20px;
        }

        .text-content {
            font-size: 0.95rem;
            line-height: 1.7;
            font-weight: 300;
        }

        .timestamp {
            font-size: 0.65rem;
            color: #333;
            margin-top: 8px;
            letter-spacing: 1px;
        }

        .selfie-img {
            max-width: 100%;
            border-radius: 2px; /* Sharp corners */
            margin-top: 15px;
            opacity: 0.9;
            filter: grayscale(20%) contrast(110%); /* Adds an edgy filter to her images */
            transition: opacity 0.3s;
        }
        
        .selfie-img:hover {
            opacity: 1;
            filter: none;
        }

        /* --- Input Area --- */
        .input-area {
            padding: 20px 30px 40px 30px;
            flex-shrink: 0;
            background: linear-gradient(transparent, var(--bg) 20%);
        }

        .input-wrapper {
            display: flex;
            align-items: flex-end;
            border-bottom: 1px solid var(--text-muted);
            padding-bottom: 10px;
            transition: border-color 0.3s ease;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent);
        }

        textarea {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.95rem;
            resize: none;
            outline: none;
            max-height: 150px;
            line-height: 1.5;
            padding-right: 15px;
        }

        textarea::placeholder {
            color: #333;
        }

        .send-btn {
            background: transparent;
            border: none;
            color: var(--accent);
            font-family: inherit;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 2px;
            cursor: pointer;
            text-transform: uppercase;
            padding-bottom: 2px;
            transition: color 0.2s;
        }

        .send-btn:hover {
            color: #ff1a40;
        }

        .send-btn:disabled {
            color: #333;
            cursor: not-allowed;
        }

        /* Typing indicator styling */
        .typing-text {
            font-size: 0.85rem;
            font-style: italic;
            color: var(--text-muted);
            animation: fade 1.5s infinite;
        }

        @keyframes fade {
            0%, 100% { opacity: 0.3; }
            50% { opacity: 1; }
        }
        
        .error-msg {
            color: var(--accent);
            font-size: 0.8rem;
            text-align: center;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <div class="brand">Xanthe</div>
            <div class="status-container">
                <span class="status-text" id="status-text">Connected</span>
                <div class="pulse" id="status-pulse"></div>
            </div>
        </header>

        <div class="chat-area" id="chat-area">
            <!-- Initial Greeting -->
            <div class="message-block xanthe-msg">
                <div class="text-content">So, you decided to drop the act. Good. I prefer it like this anyway. What do you want, Stacis?</div>
                <div class="timestamp">INITIALIZED</div>
            </div>
        </div>

        <div class="input-area">
            <div class="input-wrapper">
                <textarea 
                    id="user-input" 
                    placeholder="Enter command or message..." 
                    rows="1"
                ></textarea>
                <button class="send-btn" id="send-btn">Transmit</button>
            </div>
        </div>
    </div>

    <script>
        class XantheDirect {
            constructor() {
                // Ensure this is your active ngrok tunnel URL
                this.backendUrl = 'https://felica-proteinous-cynically.ngrok-free.dev/api/chat';
                
                this.chatArea = document.getElementById('chat-area');
                this.input = document.getElementById('user-input');
                this.sendBtn = document.getElementById('send-btn');
                this.statusText = document.getElementById('status-text');
                this.statusPulse = document.getElementById('status-pulse');
                
                this.history = [];
                this.isProcessing = false;

                this.setupEventListeners();
            }

            setupEventListeners() {
                this.sendBtn.addEventListener('click', () => this.transmit());
                
                this.input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.transmit();
                    }
                });

                // Auto-resize textarea
                this.input.addEventListener('input', () => {
                    this.input.style.height = 'auto';
                    this.input.style.height = Math.min(this.input.scrollHeight, 150) + 'px';
                });
                
                this.input.focus();
            }

            async transmit() {
                const text = this.input.value.trim();
                if (!text || this.isProcessing) return;

                // Reset input
                this.input.value = '';
                this.input.style.height = 'auto';
                
                // Render user message
                this.renderMessage('user', text);
                this.history.push({ role: 'user', content: text });
                
                this.setProcessing(true);

                try {
                    const response = await fetch(this.backendUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text, history: this.history })
                    });

                    if (!response.ok) throw new Error('Network Failure');

                    const data = await response.json();
                    
                    // Render Xanthe's response
                    this.renderMessage('xanthe', data.reply, data.triggerSelfie ? data.imageUrl : null);
                    this.history.push({ role: 'assistant', content: data.reply });

                } catch (error) {
                    console.error('Transmission error:', error);
                    this.renderError("Signal lost. Re-establish connection.");
                } finally {
                    this.setProcessing(false);
                }
            }

            renderMessage(role, text, imageUrl = null) {
                const block = document.createElement('div');
                block.className = `message-block ${role}-msg`;

                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                let imgHtml = '';
                if (imageUrl) {
                    imgHtml = `<img src="${imageUrl}" class="selfie-img" alt="Visual Data" onerror="this.style.display='none'">`;
                }

                block.innerHTML = `
                    <div class="text-content">${this.escapeHtml(text)}</div>
                    ${imgHtml}
                    <div class="timestamp">${time}</div>
                `;

                this.chatArea.appendChild(block);
                this.scrollToBottom();
            }

            renderError(text) {
                const block = document.createElement('div');
                block.className = `error-msg`;
                block.innerText = text;
                this.chatArea.appendChild(block);
                this.scrollToBottom();
            }

            setProcessing(state) {
                this.isProcessing = state;
                this.sendBtn.disabled = state;
                
                if (state) {
                    this.statusText.innerText = 'Receiving...';
                    this.statusPulse.style.backgroundColor = '#555';
                    this.statusPulse.style.boxShadow = 'none';
                    this.showTyping();
                } else {
                    this.statusText.innerText = 'Connected';
                    this.statusPulse.style.backgroundColor = 'var(--accent)';
                    this.statusPulse.style.boxShadow = '0 0 10px var(--accent)';
                    this.hideTyping();
                }
            }

            showTyping() {
                const indicator = document.createElement('div');
                indicator.id = 'typing-indicator';
                indicator.className = 'message-block xanthe-msg';
                indicator.innerHTML = `<div class="typing-text">Xanthe is typing...</div>`;
                this.chatArea.appendChild(indicator);
                this.scrollToBottom();
            }

            hideTyping() {
                const indicator = document.getElementById('typing-indicator');
                if (indicator) indicator.remove();
            }

            scrollToBottom() {
                this.chatArea.scrollTop = this.chatArea.scrollHeight;
            }

            escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
        }

        // Boot up
        document.addEventListener('DOMContentLoaded', () => {
            new XantheDirect();
        });
    </script>
</body>
</html>
