<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat with Xanthe</title>
    <style>
        :root {
            --bg-color: #0f0f11;
            --surface-color: #18181b;
            --surface-hover: #27272a;
            --text-primary: #f4f4f5;
            --text-secondary: #a1a1aa;
            --accent-color: #3b82f6; /* Clean blue for user messages */
            --xanthe-bubble: #27272a;
            --border-color: #27272a;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .app-layout {
            width: 100%;
            max-width: 900px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background-color: var(--bg-color);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        /* --- Header --- */
        .chat-header {
            height: 64px;
            display: flex;
            align-items: center;
            padding: 0 20px;
            background-color: rgba(15, 15, 17, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border-color);
            z-index: 10;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #3f3f46;
            background-image: url('https://api.dicebear.com/7.x/notionists/svg?seed=Xanthe&backgroundColor=transparent'); /* Clean minimalist avatar placeholder */
            background-size: cover;
            margin-right: 12px;
            position: relative;
        }

        .avatar::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 10px;
            height: 10px;
            background-color: #10b981; /* Online green */
            border: 2px solid var(--bg-color);
            border-radius: 50%;
        }

        .header-info {
            display: flex;
            flex-direction: column;
        }

        .header-name {
            font-weight: 600;
            font-size: 15px;
        }

        .header-status {
            font-size: 12px;
            color: var(--text-secondary);
            margin-top: 2px;
        }

        /* --- Chat Area --- */
        .chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 24px 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-container::-webkit-scrollbar {
            width: 6px;
        }

        .chat-container::-webkit-scrollbar-thumb {
            background-color: var(--surface-hover);
            border-radius: 10px;
        }

        .message-row {
            display: flex;
            width: 100%;
        }

        .message-row.user {
            justify-content: flex-end;
        }

        .message-row.xanthe {
            justify-content: flex-start;
        }

        .bubble {
            max-width: 65%;
            padding: 10px 14px;
            font-size: 15px;
            line-height: 1.5;
            word-wrap: break-word;
        }

        .message-row.user .bubble {
            background-color: var(--accent-color);
            color: #ffffff;
            border-radius: 18px 18px 4px 18px;
        }

        .message-row.xanthe .bubble {
            background-color: var(--xanthe-bubble);
            color: var(--text-primary);
            border-radius: 18px 18px 18px 4px;
        }

        .message-image {
            max-width: 300px;
            width: 100%;
            border-radius: 12px;
            margin-top: 8px;
            display: block;
        }

        .timestamp {
            font-size: 11px;
            color: var(--text-secondary);
            margin-top: 4px;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .message-row.user .timestamp {
            justify-content: flex-end;
            color: rgba(255, 255, 255, 0.7);
        }

        /* --- Input Area --- */
        .input-area {
            padding: 16px 20px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: flex-end;
            gap: 12px;
        }

        .input-wrapper {
            flex: 1;
            background-color: var(--surface-color);
            border-radius: 24px;
            padding: 10px 16px;
            display: flex;
            align-items: center;
            border: 1px solid transparent;
            transition: border-color 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--surface-hover);
        }

        textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-primary);
            font-family: inherit;
            font-size: 15px;
            resize: none;
            outline: none;
            max-height: 120px;
            line-height: 1.4;
        }

        textarea::placeholder {
            color: var(--text-secondary);
        }

        .send-btn {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--accent-color);
            border: none;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            flex-shrink: 0;
            transition: background-color 0.2s;
            margin-bottom: 2px;
        }

        .send-btn:hover {
            background-color: #2563eb;
        }

        .send-btn:disabled {
            background-color: var(--surface-hover);
            cursor: not-allowed;
        }

        .send-btn svg {
            width: 18px;
            height: 18px;
            fill: #ffffff;
            margin-left: 2px; /* Visual center adjustment */
        }

        /* --- Typing Indicator --- */
        .typing-dots {
            display: flex;
            gap: 4px;
            padding: 4px 2px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background-color: var(--text-secondary);
            border-radius: 50%;
            animation: bounce 1.4s infinite ease-in-out both;
        }

        .typing-dots span:nth-child(1) { animation-delay: -0.32s; }
        .typing-dots span:nth-child(2) { animation-delay: -0.16s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: scale(0); }
            40% { transform: scale(1); }
        }
    </style>
</head>
<body>

    <div class="app-layout">
        <!-- Header -->
        <div class="chat-header">
            <div class="avatar"></div>
            <div class="header-info">
                <span class="header-name">Xanthe</span>
                <span class="header-status" id="status-text">Online</span>
            </div>
        </div>

        <!-- Chat History -->
        <div class="chat-container" id="chat-container">
            <div class="message-row xanthe">
                <div class="bubble">
                    So, you wanted to drop the flashy aesthetic. I can work with this. Clean, simple, no distractions. What's on your mind?
                    <div class="timestamp">Just now</div>
                </div>
            </div>
        </div>

        <!-- Input Area -->
        <div class="input-area">
            <div class="input-wrapper">
                <textarea 
                    id="message-input" 
                    placeholder="Message Xanthe..." 
                    rows="1"
                ></textarea>
            </div>
            <button class="send-btn" id="send-btn">
                <svg viewBox="0 0 24 24">
                    <path d="M3.4 20.4l17.45-7.48a1 1 0 000-1.84L3.4 3.6a.993.993 0 00-1.39.91L2 9.12c0 .5.37.93.87.99L17 12 2.87 13.88c-.5.06-.87.49-.87.99l.01 4.61c0 .71.73 1.2 1.39.92z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        class ChatApp {
            constructor() {
                this.backendUrl = 'https://felica-proteinous-cynically.ngrok-free.dev/api/chat';
                
                this.chatContainer = document.getElementById('chat-container');
                this.input = document.getElementById('message-input');
                this.sendBtn = document.getElementById('send-btn');
                this.statusText = document.getElementById('status-text');
                
                this.history = [];
                this.isTyping = false;

                this.init();
            }

            init() {
                this.sendBtn.addEventListener('click', () => this.sendMessage());
                
                this.input.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                // Auto-resize textarea
                this.input.addEventListener('input', () => {
                    this.input.style.height = 'auto';
                    this.input.style.height = Math.min(this.input.scrollHeight, 120) + 'px';
                });
                
                this.input.focus();
            }

            async sendMessage() {
                const text = this.input.value.trim();
                if (!text || this.isTyping) return;

                // Clear UI immediately
                this.input.value = '';
                this.input.style.height = 'auto';
                
                // Add to UI
                this.appendMessage('user', text);
                this.history.push({ role: 'user', content: text });
                
                this.setTypingState(true);

                try {
                    const response = await fetch(this.backendUrl, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ message: text, history: this.history })
                    });

                    if (!response.ok) throw new Error('Server error');

                    const data = await response.json();
                    
                    this.appendMessage('xanthe', data.reply, data.triggerSelfie ? data.imageUrl : null);
                    this.history.push({ role: 'assistant', content: data.reply });

                } catch (error) {
                    console.error('Chat error:', error);
                    this.appendMessage('xanthe', "Message failed to send. Check the connection.");
                } finally {
                    this.setTypingState(false);
                }
            }

            appendMessage(role, text, imageUrl = null) {
                const row = document.createElement('div');
                row.className = `message-row ${role}`;
                
                const time = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
                
                let imgTag = '';
                if (imageUrl) {
                    imgTag = `<img src="${imageUrl}" class="message-image" alt="Image" onerror="this.style.display='none'">`;
                }

                row.innerHTML = `
                    <div class="bubble">
                        ${this.escapeHtml(text)}
                        ${imgTag}
                        <div class="timestamp">${time}</div>
                    </div>
                `;

                this.chatContainer.appendChild(row);
                this.scrollToBottom();
            }

            setTypingState(isTyping) {
                this.isTyping = isTyping;
                this.sendBtn.disabled = isTyping;
                
                if (isTyping) {
                    this.statusText.innerText = 'typing...';
                    
                    // Add typing bubble
                    const row = document.createElement('div');
                    row.id = 'typing-indicator';
                    row.className = `message-row xanthe`;
                    row.innerHTML = `
                        <div class="bubble">
                            <div class="typing-dots">
                                <span></span><span></span><span></span>
                            </div>
                        </div>
                    `;
                    this.chatContainer.appendChild(row);
                    this.scrollToBottom();
                } else {
                    this.statusText.innerText = 'Online';
                    const indicator = document.getElementById('typing-indicator');
                    if (indicator) indicator.remove();
                }
            }

            scrollToBottom() {
                this.chatContainer.scrollTop = this.chatContainer.scrollHeight;
            }

            escapeHtml(str) {
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML.replace(/\n/g, '<br>');
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            new ChatApp();
        });
    </script>
</body>
</html>
