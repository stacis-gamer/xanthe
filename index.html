<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xanthe - WhatsApp Clone</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #111b21;
            color: #e9edef;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        /* FIXED: Removed max-width to allow full screen scaling */
        .app-container {
            width: 100%;
            height: 100vh;
            background-color: #111b21;
            display: flex;
            flex-direction: column;
        }

        .chat-header {
            background-color: #202c33;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            border-bottom: 1px solid #2a3942;
            flex-shrink: 0;
        }

        .avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: linear-gradient(135deg, #8b0000, #ff1744);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 18px;
            color: #fff;
            position: relative;
        }

        .avatar::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 0;
            width: 12px;
            height: 12px;
            background-color: #00ff88;
            border: 2px solid #111b21;
            border-radius: 50%;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            background-color: #00ff88;
            border-radius: 50%;
            margin-left: 8px;
        }

        /* FIXED: Replaced opacity with a linear-gradient overlay so messages stay solid */
        .chat-body {
            flex: 1;
            background-color: #0b141a;
            background-image: linear-gradient(rgba(11, 20, 26, 0.94), rgba(11, 20, 26, 0.94)), url("data:image/svg+xml,%3Csvg width='90' height='90' viewBox='0 0 90 90' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cpath d='m90 5-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-13m0 31-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13m0 31-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13m0-62-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13m0 31-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13m0 31-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13-9 13-9-13%3C/g%3E%3C/svg%3E");
            background-size: 90px;
            overflow-y: auto;
            padding: 20px 5%; /* Added padding so messages don't hug the very edge on wide screens */
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .chat-body::-webkit-scrollbar {
            width: 6px;
        }

        .chat-body::-webkit-scrollbar-track {
            background: #0b141a;
        }

        .chat-body::-webkit-scrollbar-thumb {
            background: #2a3942;
            border-radius: 3px;
        }

        .message-block {
            display: flex;
            flex-direction: column;
            max-width: 70%;
        }

        .user-message {
            align-self: flex-end;
        }

        .xanthe-message {
            align-self: flex-start;
        }

        .message-bubble {
            background-color: #005c4b;
            color: #e9edef; /* Explicitly ensure text is bright */
            padding: 6px 12px;
            border-radius: 7.5px;
            position: relative;
            margin-bottom: 2px;
            word-wrap: break-word;
            max-width: 100%;
            font-size: 14.2px;
            line-height: 19px;
            box-shadow: 0 1px 0.5px rgba(11,20,26,.13);
        }

        .user-message .message-bubble {
            background-color: #005c4b;
            border-bottom-right-radius: 2px;
        }

        .xanthe-message .message-bubble {
            background-color: #202c33;
            border-bottom-left-radius: 2px;
        }

        .message-bubble::before {
            content: '';
            position: absolute;
            width: 0;
            height: 0;
            border: 6px solid transparent;
        }

        .user-message .message-bubble::before {
            right: -6px;
            bottom: 0;
            border-bottom-color: #005c4b;
            border-right: 0;
        }

        .xanthe-message .message-bubble::before {
            left: -6px;
            bottom: 0;
            border-bottom-color: #202c33;
            border-left: 0;
        }

        .message-image {
            max-width: 300px; /* Made slightly larger for better viewing on desktop */
            max-height: 300px;
            border-radius: 7.5px;
            margin-top: 4px;
        }

        .message-meta {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 4px;
            font-size: 11px;
            color: #8696a0;
            margin-top: 2px;
            padding-right: 4px;
        }

        .read-receipt {
            width: 14px;
            height: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .read-receipt svg {
            width: 16px;
            height: 16px;
            fill: #8696a0;
        }

        .typing-indicator {
            display: flex;
            align-items: center;
            gap: 4px;
            padding: 8px 12px;
            background-color: #202c33;
            border-radius: 7.5px;
            border-bottom-left-radius: 2px;
            font-size: 14px;
            color: #8696a0;
            align-self: flex-start;
        }

        .typing-dots {
            display: flex;
            gap: 2px;
        }

        .typing-dots span {
            width: 6px;
            height: 6px;
            background-color: #8696a0;
            border-radius: 50%;
            animation: typing 1.4s infinite;
        }

        .typing-dots span:nth-child(2) {
            animation-delay: 0.2s;
        }

        .typing-dots span:nth-child(3) {
            animation-delay: 0.4s;
        }

        @keyframes typing {
            0%, 60%, 100% {
                transform: translateY(0);
                opacity: 0.4;
            }
            30% {
                transform: translateY(-8px);
                opacity: 1;
            }
        }

        .input-container {
            background-color: #202c33;
            padding: 10px 5%; /* Match padding of the chat body */
            display: flex;
            gap: 12px;
            border-top: 1px solid #2a3942;
            flex-shrink: 0;
            align-items: center;
        }

        .message-input {
            flex: 1;
            background-color: #2a3942;
            border: none;
            border-radius: 21px;
            padding: 10px 16px;
            color: #e9edef;
            font-size: 14.9px;
            outline: none;
            resize: none;
            max-height: 100px;
            line-height: 19px;
        }

        .message-input::placeholder {
            color: #8696a0;
        }

        .send-button {
            width: 44px;
            height: 44px;
            border: none;
            background-color: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .send-icon {
            width: 24px;
            height: 24px;
            fill: #8696a0; /* Default grey icon like whatsapp */
            transition: fill 0.2s;
        }

        .send-button:hover .send-icon {
            fill: #e9edef;
        }

        .send-button:disabled .send-icon {
            fill: #444;
        }

        .send-button:disabled {
            cursor: not-allowed;
        }

        .error-message {
            background-color: #202c33;
            color: #ff6b6b;
            padding: 8px 12px;
            border-radius: 7.5px;
            font-size: 14px;
            align-self: center;
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="chat-header">
            <div class="avatar">X</div>
            <div>
                <div style="font-weight: 500; font-size: 16px;">Xanthe</div>
                <div style="font-size: 13px; color: #8696a0;">
                    <span id="status-indicator">online</span>
                    <span class="status-indicator"></span>
                </div>
            </div>
        </div>

        <div class="chat-body" id="chatBody">
            <div class="message-block xanthe-message">
                <div class="message-bubble">
                    Hey there... what dangerous thoughts are swirling in that mind of yours? 😈
                </div>
                <div class="message-meta">
                    <span>12:34</span>
                </div>
            </div>
        </div>

        <div class="input-container">
            <textarea 
                class="message-input" 
                id="messageInput" 
                placeholder="Type a message..."
                rows="1"
            ></textarea>
            <button class="send-button" id="sendButton" title="Send message">
                <svg class="send-icon" viewBox="0 0 24 24">
                    <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
                </svg>
            </button>
        </div>
    </div>

    <script>
        class XantheChat {
            constructor() {
                this.chatBody = document.getElementById('chatBody');
                this.messageInput = document.getElementById('messageInput');
                this.sendButton = document.getElementById('sendButton');
                this.statusIndicator = document.getElementById('status-indicator');
                
                this.chatHistory = [];
                this.isTyping = false;
                
                this.init();
            }

            init() {
                this.sendButton.addEventListener('click', () => this.sendMessage());
                this.messageInput.addEventListener('keydown', (e) => {
                    if (e.key === 'Enter' && !e.shiftKey) {
                        e.preventDefault();
                        this.sendMessage();
                    }
                });

                this.messageInput.addEventListener('input', this.autoResize.bind(this));
                this.messageInput.focus();
            }

            autoResize() {
                this.messageInput.style.height = 'auto';
                this.messageInput.style.height = Math.min(this.messageInput.scrollHeight, 100) + 'px';
            }

            async sendMessage() {
                const message = this.messageInput.value.trim();
                if (!message || this.isTyping) return;

                this.appendUserMessage(message);
                this.messageInput.value = '';
                this.autoResize();
                this.setTypingStatus(true);

                try {
                    const response = await fetch('https://felica-proteinous-cynically.ngrok-free.dev/api/chat', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            message: message,
                            history: this.chatHistory
                        })
                    });

                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }

                    const data = await response.json();
                    this.handleResponse(data);
                } catch (error) {
                    console.error('Chat error:', error);
                    this.appendErrorMessage('Connection failed. Server might be offline.');
                } finally {
                    this.setTypingStatus(false);
                }
            }

            appendUserMessage(message) {
                const messageTime = this.formatTime(new Date());
                const messageBlock = document.createElement('div');
                messageBlock.className = 'message-block user-message';
                messageBlock.innerHTML = `
                    <div class="message-bubble">${this.escapeHtml(message)}</div>
                    <div class="message-meta">
                        <span>${messageTime}</span>
                        <div class="read-receipt">
                            <svg viewBox="0 0 16 16">
                                <path d="M10.91 3.316L6.25 8.079l-1.91-1.9L3 6.37l3.25 3.22L13 4.112z"/>
                                <path fill-opacity=".3" d="M10.91 3.316L6.25 8.079l-1.91-1.9L3 6.37l3.25 3.22L13 4.112z"/>
                            </svg>
                        </div>
                    </div>
                `;
                this.chatBody.appendChild(messageBlock);
                this.scrollToBottom();
                this.chatHistory.push({ role: 'user', content: message });
            }

            handleResponse(data) {
                if (data.reply) {
                    this.appendXantheMessage(data.reply, data.imageUrl || null);
                    this.chatHistory.push({ role: 'assistant', content: data.reply });
                }
            }

            appendXantheMessage(message, imageUrl) {
                const messageTime = this.formatTime(new Date());
                const messageBlock = document.createElement('div');
                messageBlock.className = 'message-block xanthe-message';
                
                let imageHtml = '';
                if (imageUrl) {
                    imageHtml = `<br><img src="${imageUrl}" alt="Xanthe selfie" class="message-image" onerror="this.style.display='none'">`;
                }

                messageBlock.innerHTML = `
                    <div class="message-bubble">${this.escapeHtml(message)}${imageHtml}</div>
                    <div class="message-meta">
                        <span>${messageTime}</span>
                    </div>
                `;
                this.chatBody.appendChild(messageBlock);
                this.scrollToBottom();
            }

            appendErrorMessage(message) {
                const errorDiv = document.createElement('div');
                errorDiv.className = 'error-message';
                errorDiv.textContent = message;
                this.chatBody.appendChild(errorDiv);
                this.scrollToBottom();
            }

            setTypingStatus(typing) {
                this.isTyping = typing;
                this.sendButton.disabled = typing;
                
                if (typing) {
                    this.statusIndicator.textContent = 'typing...';
                    this.showTypingIndicator();
                } else {
                    this.statusIndicator.textContent = 'online';
                    this.hideTypingIndicator();
                }
            }

            showTypingIndicator() {
                const typingDiv = document.createElement('div');
                typingDiv.id = 'typing-indicator';
                typingDiv.className = 'typing-indicator';
                typingDiv.innerHTML = `
                    <div>Xanthe</div>
                    <div class="typing-dots">
                        <span></span><span></span><span></span>
                    </div>
                `;
                this.chatBody.appendChild(typingDiv);
                this.scrollToBottom();
            }

            hideTypingIndicator() {
                const typingIndicator = document.getElementById('typing-indicator');
                if (typingIndicator) {
                    typingIndicator.remove();
                }
            }

            scrollToBottom() {
                this.chatBody.scrollTop = this.chatBody.scrollHeight;
            }

            formatTime(date) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }

            escapeHtml(text) {
                const div = document.createElement('div');
                div.textContent = text;
                return div.innerHTML;
            }
        }

        // Initialize chat when DOM is loaded
        document.addEventListener('DOMContentLoaded', () => {
            new XantheChat();
        });
    </script>
</body>
</html>
